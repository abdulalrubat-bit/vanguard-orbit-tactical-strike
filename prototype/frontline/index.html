<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Modern Frontline</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#101417;color:#eee;font-family:Arial,sans-serif;touch-action:none}
body{display:flex;flex-direction:column}
#top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#1a2024;border-bottom:1px solid #394248}
#title{font-weight:700;font-size:18px}
#status{font-size:13px;color:#b9c5ca;text-align:right}
#game{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
canvas{display:block;background:#24302b;border:1px solid #46534e;max-width:100%;max-height:100%;width:min(96vw,78vh);height:min(96vw,78vh);image-rendering:auto}
#bottom{min-height:78px;background:#1a2024;border-top:1px solid #394248;display:flex;align-items:center;gap:8px;padding:8px 10px}
button{border:1px solid #56636a;background:#2b353a;color:#fff;border-radius:8px;padding:11px 14px;font-size:14px;font-weight:700}
button:active{transform:scale(.97);background:#3a464c}
#unitInfo{flex:1;font-size:12px;line-height:1.35;color:#c8d1d4}
.overlay{position:fixed;inset:0;background:rgba(8,11,13,.94);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.panel{width:min(430px,94vw);background:#1b2226;border:1px solid #4a565c;border-radius:14px;padding:22px;box-shadow:0 15px 50px #000}
.panel h1{margin:0 0 7px;font-size:28px}
.panel p{margin:0 0 18px;color:#aeb9bd;font-size:14px}
.factions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.factions button{padding:18px 10px;font-size:15px}
.hidden{display:none!important}
#zoomControls{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:7px;z-index:3}
#zoomControls button{width:46px;height:46px;padding:0;font-size:25px;line-height:1;border-radius:10px;background:rgba(27,34,38,.92);backdrop-filter:blur(3px)}
#zoomLevel{font-size:11px;text-align:center;color:#d4dcdf;background:rgba(27,34,38,.88);border:1px solid #56636a;border-radius:8px;padding:5px 2px}
#message{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:#20292d;border:1px solid #536168;padding:8px 14px;border-radius:20px;font-size:13px;z-index:4;opacity:0;pointer-events:none;transition:opacity .15s}
</style>
</head>
<body>
<div id="top">
  <div id="title">MODERN FRONTLINE</div>
  <div id="status">Choose a faction</div>
</div>
<div id="game">
  <canvas id="board"></canvas>
  <div id="zoomControls">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <div id="zoomLevel">100%</div>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="zoomReset" aria-label="Reset zoom">1×</button>
  </div>
</div>
<div id="bottom">
  <div id="unitInfo">Select a unit.</div>
  <button id="reinforce">REINFORCE</button>
  <button id="endTurn">END TURN</button>
</div>
<div id="message"></div>

<div id="factionOverlay" class="overlay">
  <div class="panel">
    <h1>Modern Frontline</h1>
    <p>Choose your faction. Command your forces and capture the objective.</p>
    <div class="factions">
      <button data-faction="USA">USA</button>
      <button data-faction="Russia">Russia</button>
      <button data-faction="China">China</button>
      <button data-faction="UK">UK</button>
    </div>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <h1 id="gameOverTitle">Victory</h1>
    <p id="gameOverText"></p>
    <button id="nextMission" class="hidden">NEXT MISSION</button>
    <button id="restart">PLAY AGAIN</button>
  </div>
</div>

function resize(){
  const r=canvas.getBoundingClientRect();
  const size=Math.min(r.width,r.height);
  const d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(size*d);
  canvas.height=Math.floor(size*d);
  ctx.setTransform(d,0,0,d,0,0);
  tile=size/VIEW_TILES*zoom;
  clampCamera();
  updateZoomLabel();
  draw();
}
function visibleTiles(){ return VIEW_TILES/zoom; }
function clampCamera(){
  const v=visibleTiles();
  cameraX=Math.max(0,Math.min(N-v,cameraX));
  cameraY=Math.max(0,Math.min(N-v,cameraY));
}
function updateZoomLabel(){
  document.getElementById("zoomLevel").textContent=Math.round(zoom*100)+"%";
}
function setZoom(next,screenX=canvas.clientWidth/2,screenY=canvas.clientHeight/2){
  const oldTile=tile;
  const worldX=cameraX+screenX/oldTile;
  const worldY=cameraY+screenY/oldTile;
  zoom=Math.max(.75,Math.min(2.25,next));
  const size=canvas.clientWidth;
  tile=size/VIEW_TILES*zoom;
  cameraX=worldX-screenX/tile;
  cameraY=worldY-screenY/tile;
  clampCamera();
  updateZoomLabel();
  draw();
}
window.addEventListener("resize",resize);

function makeUnit(faction,type,x,y){
  const t=unitTypes[type];
  const u={id:nextId++,faction,type,x,y,hp:t.hp,maxHp:t.maxHp,move:t.move,range:t.range,damage:t.damage,armor:t.armor,moveCost:t.moveCost,vs:t.vs,acted:false};

  // Small faction identity bonuses keep the same four unit classes
  // while giving each faction a distinct battlefield feel.
  if(faction==="USA" && type==="artillery"){u.range+=1;}
  if(faction==="Russia" && type==="tank"){u.hp+=2;u.maxHp+=2;}
  if(faction==="China" && type==="infantry"){u.maxHp+=1;u.hp+=1;}
  if(faction==="UK" && type==="recon"){u.move+=1;}

  return u;
}

function setup(faction,continueCampaign=false){
  if(!continueCampaign){
    campaignMission=1;
    credits=100;
    campaignWins=0;
    campaignRoster=null;
  }

  playerFaction=faction;
  turn=1;
  phase="player";
  selected=null;
  enemyBusy=false;
  // Start over the player deployment zone so units are visible immediately.
  cameraX=0;cameraY=12;
  nextId=1;
  units=[];

  const missionLayouts={
    1:[
      {x:9,y:9,value:1},{x:12,y:11,value:2},
      {x:15,y:9,value:1},{x:12,y:15,value:1}
    ],
    2:[
      {x:6,y:8,value:1},{x:17,y:8,value:1},
      {x:7,y:16,value:2},{x:18,y:16,value:1}
    ],
    3:[
      {x:8,y:6,value:1},{x:16,y:6,value:1},
      {x:7,y:16,value:1},{x:17,y:16,value:1},
      {x:12,y:11,value:2}
    ]
  };

  points=missionLayouts[campaignMission].map(p=>({...p}));
  points.forEach((p,i)=>{
    p.owner=null;p.capture=0;p.secured=false;p.contested=false;p.hold=0;
    p.type=(campaignMission===3&&i===4)?"hq":(i===1?"bridge":"control");
  });
  missionObjectiveVP=campaignMission===1?3:campaignMission===2?4:5;
  points.forEach(p=>{p.owner=null;p.capture=0;p.secured=false;p.contested=false;});
  missionObjectiveVP=campaignMission===1?3:campaignMission===2?4:5;

  if(continueCampaign && campaignRoster && campaignRoster.length){
    const deployment=[
      {x:2,y:21},{x:3,y:21},{x:2,y:19},{x:4,y:20},
      {x:4,y:21},{x:5,y:20},{x:1,y:20}
    ];

    campaignRoster.forEach((saved,i)=>{
      const pos=deployment[i%deployment.length];
      const u=makeUnit(faction,saved.type,pos.x,pos.y);
      u.hp=Math.min(saved.hp,u.maxHp);
      u.acted=false;
      units.push(u);
    });
  }else{
    units.push(
      makeUnit(faction,"infantry",2,21),
      makeUnit(faction,"tank",3,21),
      makeUnit(faction,"artillery",2,19),
      makeUnit(faction,"recon",4,20)
    );

    // Faction identity: each faction begins with one extra specialist.
    const identityUnit={
      China:["infantry",4,21],
      UK:["recon",5,20],
      USA:["artillery",3,19],
      Russia:["tank",4,21]
    }[faction];
    units.push(makeUnit(faction,identityUnit[0],identityUnit[1],identityUnit[2]));
  }

  const enemy= factionNames.filter(f=>f!==faction);
  const enemyBase=[
    [{x:21,y:2},{x:20,y:2}],
    [{x:21,y:5},{x:20,y:5}],
    [{x:19,y:2},{x:21,y:4}]
  ];

  enemy.forEach((f,i)=>{
    const positions=enemyBase[i];
    units.push(
      makeUnit(f,"infantry",positions[0].x,positions[0].y),
      makeUnit(f,"tank",positions[1].x,positions[1].y)
    );

    if(campaignMission>=2) units.push(makeUnit(f,"recon",Math.max(0,positions[0].x-1),positions[0].y+2));
    if(campaignMission>=3) units.push(makeUnit(f,"artillery",Math.max(0,positions[1].x-1),positions[1].y+2));
  });

  factionOverlay.classList.add("hidden");
  gameOver.classList.add("hidden");
  document.getElementById("nextMission").classList.add("hidden");
  showMessage("Mission "+campaignMission+" — Your turn");
  updateUI();
  draw();
}
function terrain(x,y){
  // Roads and the central bridge create long movement corridors.
  if(y===11&&x>=10&&x<=13) return "bridge";
  if((y===11&&x>=7&&x<=16)||(x===11&&y>=5&&y<=18)) return "road";

  // Built-up areas create defensive zones around the objectives.
  if((x>=7&&x<=10&&y>=8&&y<=10) ||
     (x>=14&&x<=17&&y>=13&&y<=16) ||
     (x>=10&&x<=13&&y>=18&&y<=20)) return "city";

  // Hills form several natural high-ground positions.
  if((x>=3&&x<=5&&y>=6&&y<=8) ||
     (x>=18&&x<=21&&y>=5&&y<=7) ||
     (x>=16&&x<=18&&y>=17&&y<=19)) return "hill";

  // Forest belts create flanking routes and cover.
  if((x>=2&&x<=5&&y>=11&&y<=16) ||
     (x>=18&&x<=21&&y>=9&&y<=14) ||
     (x>=6&&x<=8&&y>=2&&y<=5) ||
     (x>=14&&x<=16&&y>=3&&y<=6)) return "forest";

  return "open";
}

function road(x,y){
  return (y===11&&x>=0&&x<N) || (x===11&&y>=0&&y<N);
}

function terrainColor(t){
  return {
    open:"#26362f",
    forest:"#1d3029",
    hill:"#394238",
    city:"#343b3d",
    road:"#303a3b",
    bridge:"#4a4034"
  }[t];
}

function distance(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}

function unitAt(x,y){
  return units.find(u=>u.x===x&&u.y===y&&u.hp>0);
}

function inBounds(x,y){return x>=0&&x<N&&y>=0&&y<N}

function movementCost(u,x,y){
  return unitTypes[u.type].moveCost[terrain(x,y)]||1;
}

function canMove(u,x,y){
  if(!inBounds(x,y)||unitAt(x,y)) return false;
  const cost=movementCost(u,x,y);
  return cost<= (u.move||unitTypes[u.type].move);
}

function canAttack(u,target){
  return target && target.faction!==u.faction &&
    distance(u,target)<= (u.range||unitTypes[u.type].range);
}

function endPlayerTurn(){
  if(phase!=="player"||enemyBusy) return;
  processObjectives();
  if(checkWin()) return;
  selected=null;
  phase="enemy";
  enemyBusy=true;
  updateUI();
  draw();
  setTimeout(enemyTurn,350);
}

function enemyTurn(){
  if(phase!=="enemy"||!enemyBusy) return;

  const enemies=units.filter(u=>u.faction!==playerFaction&&u.hp>0);

  for(const u of enemies){
    if(u.hp<=0) continue;

    const targets=units.filter(t=>t.faction===playerFaction&&t.hp>0);
    if(!targets.length) break;

    let target=targets.reduce((a,b)=>distance(u,a)<distance(u,b)?a:b);

    // Attack immediately if already in range.
    if(canAttack(u,target)){
      attack(u,target);
      processObjectives();
      if(checkWin()) return;
      continue;
    }

    // Use the unit's full movement allowance instead of moving only one tile.
    // Stop early when an enemy enters attack range.
    let movementLeft=u.move||unitTypes[u.type].move;

    while(movementLeft>0){
      const liveTargets=units.filter(t=>t.faction===playerFaction&&t.hp>0);
      if(!liveTargets.length) break;

      target=liveTargets.reduce((a,b)=>distance(u,a)<distance(u,b)?a:b);

      const attackTargets=liveTargets
        .filter(t=>canAttack(u,t))
        .sort((a,b)=>targetValue(u,b)-targetValue(u,a));

      if(attackTargets.length){
        attack(u,attackTargets[0]);
        processObjectives();
        if(checkWin()) return;
        break;
      }

      const objective=bestObjectiveFor(u);
      const step=bestMoveToward(u,objective);

      if(!step) break;

      const cost=movementCost(u,step.x,step.y);
      if(cost>movementLeft) break;

      u.x=step.x;
      u.y=step.y;
      movementLeft-=cost;
      processObjectives();
    }

    // If movement brought a target into range, fire before ending the unit's turn.
    if(u.hp>0){
      const finalTargets=units
        .filter(t=>t.faction===playerFaction&&t.hp>0&&canAttack(u,t))
        .sort((a,b)=>targetValue(u,b)-targetValue(u,a));

      if(finalTargets.length){
        attack(u,finalTargets[0]);
        processObjectives();
        if(checkWin()) return;
      }
    }

    u.acted=true;
  }

  if(checkWin(true)){
    enemyBusy=false;
    return;
  }

  processObjectives();
  if(checkWin()){
    enemyBusy=false;
    return;
  }

  processObjectives();
  if(checkWin()){
    enemyBusy=false;
    return;
  }

  units.forEach(u=>u.acted=false);

  enemyBusy=false;
  phase="player";
  turn++;
  credits+=5;
  selected=null;
  showMessage("Your turn");
  updateUI();
  draw();
}

function attack(attacker,target){
  const a=unitTypes[attacker.type];
  const defender=unitTypes[target.type];

  // Each unit has a matchup value against every target type.
  let damage=a.vs[target.type];

  // Terrain gives the defender protection.
  const t=terrain(target.x,target.y);
  if(t==="forest") damage-=1;
  if(t==="hill") damage-=2;
  if(t==="city") damage-=2;

  // Artillery is vulnerable when caught in close combat.
  if(attacker.type==="artillery" && distance(attacker,target)<=1){
    damage=Math.max(1,damage-2);
  }

  // Armour reduces damage taken by armoured units.
  if(target.type==="tank" && attacker.type!=="tank" && attacker.type!=="artillery"){
    damage-=defender.armor;
  }

  damage=Math.max(1,damage);

  target.hp-=damage;
  attacker.acted=true;

  if(target.hp<=0){
    target.hp=0;
    showMessage(attacker.faction+" destroyed "+unitTypes[target.type].name);
  }else{
    showMessage(unitTypes[attacker.type].name+" dealt "+damage+" damage");
  }
}

function playerAction(x,y){
  if(phase!=="player"||enemyBusy) return;
  const clicked=unitAt(x,y);

  if(selected===null){
    if(clicked&&clicked.faction===playerFaction&&!clicked.acted){
      selected=clicked.id;
      centerCameraOn(clicked);
      showMessage(unitTypes[clicked.type].name+" selected");
    }
    updateUI();draw();return;
  }

  const u=units.find(a=>a.id===selected);
  if(!u||u.hp<=0){selected=null;draw();return}

  if(clicked&&clicked.faction===playerFaction){
    if(!clicked.acted) selected=clicked.id;
    updateUI();draw();return;
  }

  if(clicked&&clicked.faction!==playerFaction){
    if(canAttack(u,clicked)){
      attack(u,clicked);
      selected=null;
      if(checkWin()) return;
    }else showMessage("Target out of range");
    updateUI();draw();return;
  }

  if(canMove(u,x,y)){
    u.x=x;u.y=y;u.acted=true;
    selected=null;
    processObjectives();
    if(checkWin()) return;
    updateUI();draw();return;
  }

  showMessage("Cannot move there");
}

function objectiveUnits(p){
  return units.filter(u=>u.hp>0&&u.x===p.x&&u.y===p.y);
}
function objectiveCapturePower(u){
  return u.type==="infantry"?25:u.type==="recon"?15:u.type==="tank"?10:0;
}
function processObjectives(){
  const rules=missionObjectiveRules[campaignMission];
  for(const p of points){
    const occ=objectiveUnits(p);
    const mine=occ.filter(u=>u.faction===playerFaction);
    const theirs=occ.filter(u=>u.faction!==playerFaction);
    p.contested=mine.length>0&&theirs.length>0;
    if(p.contested){p.hold=0;continue;}

    if(mine.length){
      const power=mine.reduce((s,u)=>s+objectiveCapturePower(u),0);
      if(power){
        p.capture=Math.min(100,p.capture+power);
        if(p.capture>=100)p.owner=playerFaction;
      }
    }else if(theirs.length){
      const power=theirs.reduce((s,u)=>s+objectiveCapturePower(u),0);
      if(power){
        p.capture=Math.max(0,p.capture-power);
        if(p.capture<=0)p.owner=theirs[0].faction;
      }
    }

    if(p.owner===playerFaction){
      if(mine.length){p.secured=true;p.hold=Math.min(rules.holdTurns,p.hold+1);}
      else {p.secured=false;p.hold=0;}
    }else{p.secured=false;p.hold=0;}
  }
  const secured=points.filter(p=>p.owner===playerFaction&&p.secured);
  credits+=secured.length*rules.creditPerSecured;
}
function objectiveVictory(){
  const rules=missionObjectiveRules[campaignMission];
  const secured=points.filter(p=>p.owner===playerFaction&&p.secured&&p.hold>=rules.holdTurns);
  const vp=secured.reduce((s,p)=>s+(p.value||1),0);
  return vp>=missionObjectiveVP;
}

function checkWin(){
  const alive=units.filter(u=>u.hp>0);
  const playerAlive=alive.some(u=>u.faction===playerFaction);
  const enemyAlive=alive.some(u=>u.faction!==playerFaction);

  if(!playerAlive){finish(false,"Your forces have been destroyed.");return true;}
  if(!enemyAlive){finish(true,"All enemy forces have been destroyed.");return true;}
  if(turn>1&&objectiveVictory()){
    finish(true,`Victory: ${missionObjectiveVP} objective VP secured.`);
    return true;
  }
  return false;
}

function finish(win,text){
  phase="over";
  enemyBusy=false;
  selected=null;

  if(win){
    campaignWins++;
    credits+=50;
    campaignRoster=units
      .filter(u=>u.faction===playerFaction&&u.hp>0)
      .map(u=>({type:u.type,hp:u.hp,maxHp:u.maxHp}));
  }

  document.getElementById("gameOverTitle").textContent=win?"VICTORY":"DEFEAT";
  document.getElementById("gameOverText").textContent=
    text+"  Campaign credits: "+credits+".";

  const next=document.getElementById("nextMission");
  next.classList.toggle("hidden",!(win&&campaignMission<3));

  gameOver.classList.remove("hidden");
  updateUI();
  draw();
}

function updateUI(){
  const alive=units.filter(u=>u.hp>0);
  const ours=alive.filter(u=>u.faction===playerFaction).length;
  const enemies=alive.length-ours;
  const phaseText=phase==="player"?"YOUR TURN":phase==="enemy"?"ENEMY TURN":phase.toUpperCase();
  statusEl.textContent=playerFaction+"  •  "+factionTraits[playerFaction].label+"  •  Mission "+campaignMission+"  •  Turn "+turn+"  •  "+phaseText+"  •  Credits "+credits;
  endTurnBtn.disabled=phase!=="player"||enemyBusy;
  document.getElementById("reinforce").disabled=phase!=="player"||enemyBusy;
  if(selected!==null){
    const u=units.find(a=>a.id===selected);
    if(u) infoEl.textContent=`${unitTypes[u.type].name}  |  HP ${u.hp}/${u.maxHp}  |  Move ${u.move||unitTypes[u.type].move}  |  Range ${u.range||unitTypes[u.type].range}  |  ${u.acted?"ACTED":"READY"}`;
  }else{
    infoEl.textContent=`Forces: ${ours}  |  Enemy units: ${enemies}  |  Objectives: ${points.filter(p=>p.owner===playerFaction).length}/${points.length}`;
  }
}

function reinforce(){
  if(phase!=="player") return;

  const cost=35;
  if(credits<cost){
    showMessage("Need "+cost+" credits");
    return;
  }

  const spots=[
    {x:1,y:15},{x:2,y:15},{x:3,y:15},
    {x:1,y:14},{x:4,y:15}
  ];

  const spot=spots.find(p=>!unitAt(p.x,p.y));
  if(!spot){
    showMessage("Deployment area occupied");
    return;
  }

  credits-=cost;
  units.push(makeUnit(playerFaction,"infantry",spot.x,spot.y));
  showMessage("Infantry reinforced");
  updateUI();
  draw();
}

function showMessage(text){
  messageEl.textContent=text;
  messageEl.style.opacity="1";
  clearTimeout(showMessage.timer);
  showMessage.timer=setTimeout(()=>messageEl.style.opacity="0",1000);
}

function spriteKey(u){
  if(u.type==="tank") return u.faction==="USA"?"USA_tank_body":u.faction==="Russia"?"RU_tank_body":u.faction==="China"?"CH_tank_body":"UK_tank_body";
  if(u.type==="artillery") return u.faction==="USA"?"USA_artillery":u.faction==="Russia"?"RU_artillery":u.faction==="China"?"CH_artillery":"UK_artillery";
  if(u.type==="recon") return u.faction==="Russia"?"RU_recon":"USA_recon";
  if(u.faction==="USA"||u.faction==="UK") return "infantry_green";
  return "infantry_kaki";
}

function drawSprite(u,cx,cy,s){
  const key=spriteKey(u);
  if(failedSprites.has(key)) return false;
  if(!assetImages[key]){ failedSprites.add(key); return false; }
  if(!spriteCache[key]){
    const img=new Image();
    img.onload=()=>requestAnimationFrame(draw);
    img.onerror=()=>{ failedSprites.add(key); delete spriteCache[key]; };
    img.src=assetImages[key];
    spriteCache[key]=img;
  }
  const img=spriteCache[key];
  if(img && img.complete && img.naturalWidth){
    const max=s*.82;
    const scale=Math.min(max/img.naturalWidth,max/img.naturalHeight);
    const w=img.naturalWidth*scale,h=img.naturalHeight*scale;
    ctx.drawImage(img,cx-w/2,cy-h/2,w,h);
    return true;
  }
  return false;
}

function drawUnitIcon(u,cx,cy,s,own){
  // Reliable built-in unit symbols. Sprites are optional and must never block rendering.
  ctx.save();
  ctx.strokeStyle=own?"#d9f1dc":"#f1d4d2";
  ctx.fillStyle=own?"#6fae7c":"#b66b67";
  ctx.lineWidth=Math.max(1.5,s*.045);
  if(u.type==="infantry"){
    ctx.beginPath();ctx.arc(cx,cy-s*.08,s*.16,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy+s*.02);ctx.lineTo(cx-s*.25,cy+s*.28);ctx.lineTo(cx+s*.25,cy+s*.28);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(u.type==="tank"){
    ctx.fillRect(cx-s*.30,cy-s*.18,s*.60,s*.36);ctx.strokeRect(cx-s*.30,cy-s*.18,s*.60,s*.36);
    ctx.beginPath();ctx.arc(cx,cy,s*.14,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+s*.34,cy);ctx.stroke();
  }else if(u.type==="artillery"){
    ctx.beginPath();ctx.arc(cx,cy+s*.06,s*.19,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+s*.30,cy-s*.30);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(cx,cy-s*.32);ctx.lineTo(cx+s*.29,cy);ctx.lineTo(cx,cy+s*.32);ctx.lineTo(cx-s*.29,cy);ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.restore();
}

function draw(){
  const size=canvas.clientWidth;
  if(!size)return;
  ctx.clearRect(0,0,size,size);
  ctx.save();
  ctx.translate(-cameraX*tile,-cameraY*tile);

  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const t=terrain(x,y);
      ctx.fillStyle=terrainColor(t);
      ctx.fillRect(x*tile,y*tile,tile,tile);

      if(road(x,y)){
        ctx.fillStyle="rgba(92,92,86,.34)";
        ctx.fillRect(x*tile,y*tile,tile,tile);
        ctx.fillStyle="rgba(210,205,180,.18)";
        if(x===5||x===6) ctx.fillRect(x*tile+tile*.47,y*tile,tile*.06,tile);
        if(y===6) ctx.fillRect(x*tile,y*tile+tile*.47,tile,tile*.06);
      }

      ctx.strokeStyle="rgba(255,255,255,.08)";
      ctx.strokeRect(x*tile,y*tile,tile,tile);

      if(t==="forest"){
        ctx.fillStyle="rgba(12,45,30,.8)";
        for(let i=0;i<3;i++){
          const tx=x*tile+tile*(.25+i*.25), ty=y*tile+tile*(.28+(i%2)*.28);
          ctx.beginPath(); ctx.moveTo(tx,ty-tile*.16); ctx.lineTo(tx-tile*.14,ty+tile*.12); ctx.lineTo(tx+tile*.14,ty+tile*.12); ctx.closePath(); ctx.fill();
        }
      }
      if(t==="hill"){
        ctx.fillStyle="rgba(215,220,195,.12)";
        ctx.beginPath(); ctx.moveTo(x*tile+tile*.15,y*tile+tile*.78); ctx.lineTo(x*tile+tile*.5,y*tile+tile*.22); ctx.lineTo(x*tile+tile*.85,y*tile+tile*.78); ctx.closePath(); ctx.fill();
      }
      if(t==="city"){
        ctx.fillStyle="rgba(220,220,220,.13)";
        ctx.fillRect(x*tile+tile*.18,y*tile+tile*.2,tile*.64,tile*.58);
        ctx.fillStyle="rgba(20,24,25,.25)";
        ctx.fillRect(x*tile+tile*.28,y*tile+tile*.3,tile*.16,tile*.16);
        ctx.fillRect(x*tile+tile*.56,y*tile+tile*.3,tile*.16,tile*.16);
        ctx.fillRect(x*tile+tile*.28,y*tile+tile*.58,tile*.16,tile*.12);
        ctx.fillRect(x*tile+tile*.56,y*tile+tile*.58,tile*.16,tile*.12);
      }
    }
  }

  for(const p of points){
    ctx.beginPath();
    ctx.arc(p.x*tile+tile/2,p.y*tile+tile/2,tile*.25,0,Math.PI*2);
    ctx.fillStyle=p.owner?"rgba(255,210,80,.72)":"rgba(220,220,220,.28)";
    ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.8)";
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.lineWidth=1;
    ctx.fillStyle="rgba(255,255,255,.85)";
    ctx.font=`bold ${Math.max(9,tile*.15)}px Arial`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("OBJ",p.x*tile+tile/2,p.y*tile+tile/2);
  }

  if(selected!==null){
    const u=units.find(a=>a.id===selected);
    if(u&&phase==="player"&&!u.acted){
      const range=u.move||unitTypes[u.type].move;
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){
        if(canMove(u,x,y)){
          ctx.fillStyle="rgba(90,180,255,.20)";
          ctx.fillRect(x*tile+1,y*tile+1,tile-2,tile-2);
        }
      }
      for(const e of units.filter(e=>e.faction!==playerFaction&&e.hp>0)){
        if(canAttack(u,e)){
          ctx.strokeStyle="rgba(255,90,70,.9)";
          ctx.lineWidth=3;
          ctx.strokeRect(e.x*tile+4,e.y*tile+4,tile-8,tile-8);
          ctx.lineWidth=1;
        }
      }
    }
  }

  for(const u of units){
    if(u.hp<=0)continue;
    const cx=u.x*tile+tile/2,cy=u.y*tile+tile/2;
    const own=u.faction===playerFaction;
    const radius=tile*.31;

    ctx.fillStyle=own?"rgba(35,70,45,.92)":"rgba(82,40,40,.92)";
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.fill();

    if(u.id===selected){
      ctx.strokeStyle="#ffffff";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(cx,cy,tile*.39,0,Math.PI*2);
      ctx.stroke();
      ctx.lineWidth=1;
    }

    drawUnitIcon(u,cx,cy,tile*.72,own);

    // Phase 1 sprite reintroduction: tanks only.
    // The procedural icon above remains the guaranteed fallback.
    if(u.type==="tank"){
      try{ drawSprite(u,cx,cy,tile*.72); }catch(err){}
    }

    ctx.fillStyle="#f3f3ee";
    ctx.font=`bold ${Math.max(8,tile*.13)}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(factionMark[u.faction],cx,cy+tile*.41);

    ctx.fillStyle="#111";
    ctx.fillRect(u.x*tile+tile*.10,u.y*tile+tile*.045,tile*.80,5);
    ctx.fillStyle=u.hp/unitTypes[u.type].maxHp>.5?"#83d28f":"#e0a45d";
    ctx.fillRect(u.x*tile+tile*.10,u.y*tile+tile*.045,tile*.80*(u.hp/unitTypes[u.type].maxHp),5);
  }
  ctx.restore();
}

let pointerStart=null;
let didDrag=false;

canvas.addEventListener("pointerdown",e=>{
  pointerStart={x:e.clientX,y:e.clientY};
  didDrag=false;
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
  if(!pointerStart) return;
  const dx=e.clientX-pointerStart.x;
  const dy=e.clientY-pointerStart.y;
  if(Math.abs(dx)+Math.abs(dy)<8) return;
  didDrag=true;
  cameraX-=dx/tile;
  cameraY-=dy/tile;
  clampCamera();
  pointerStart={x:e.clientX,y:e.clientY};
  draw();
});

/* ---------------------------------------------------------------------
   PROTOTYPE FIXES, part two: the enemy AI.

   enemyTurn() calls bestObjectiveFor, bestMoveToward and targetValue. None
   of the three exists in the file, so ending your turn throws, `phase`
   stays "enemy" and `enemyBusy` stays true — which means the player can
   never act again. Together with the missing screenToWorld below, the game
   cannot currently be played at all.

   These are reconstructions written to the contracts the call sites imply,
   not recovered originals. They are deliberately simple and readable so
   they can be judged and replaced rather than inherited.
   --------------------------------------------------------------------- */

/* Higher is a better thing to shoot. Sorted descending at all four call
   sites. A kill is worth far more than chip damage, and artillery is worth
   removing early because it is the only unit that outranges everything. */
function targetValue(attacker, target){
  const dmg = (attacker.vs && attacker.vs[target.type]) || attacker.damage || 1;
  const kills = dmg >= target.hp ? 40 : 0;
  const soft  = target.type === 'artillery' ? 8 : target.type === 'recon' ? 4 : 0;
  return kills + dmg * 4 + soft - target.hp;
}

/* What this unit is walking towards: the nearest objective it does not
   already hold, and failing that the nearest enemy. Artillery hangs back
   one step behind, because walking a range-4 gun onto a control point is
   how it dies. */
function bestObjectiveFor(unit){
  const wanted = points.filter(p => p.owner !== unit.faction);
  const pool = wanted.length ? wanted : points;
  let best = null, bd = Infinity;
  for (const p of pool){
    const d = Math.abs(p.x - unit.x) + Math.abs(p.y - unit.y);
    if (d < bd){ bd = d; best = p; }
  }
  if (!best){
    const foes = units.filter(u => u.hp > 0 && u.faction !== unit.faction);
    if (!foes.length) return null;
    best = foes.reduce((a, b) => distance(unit, a) < distance(unit, b) ? a : b);
  }
  return best;
}

/* One step, not a path. The caller checks movementCost itself and loops, so
   this only has to answer "which neighbour gets me closer", breaking ties
   towards cheaper ground. Greedy and therefore capable of walking into a
   dead end — acceptable on a 24x24 map with this much open terrain, and the
   honest place to put A* later. */
function bestMoveToward(unit, goal){
  if (!goal) return null;
  const here = Math.abs(goal.x - unit.x) + Math.abs(goal.y - unit.y);
  const opts = [
    { x: unit.x + 1, y: unit.y }, { x: unit.x - 1, y: unit.y },
    { x: unit.x, y: unit.y + 1 }, { x: unit.x, y: unit.y - 1 }
  ].filter(p => inBounds(p.x, p.y) && !unitAt(p.x, p.y));
  let best = null, bd = here + 0.001;
  for (const p of opts){
    const score = Math.abs(goal.x - p.x) + Math.abs(goal.y - p.y)
                + movementCost(unit, p.x, p.y) * 0.1;
    if (score < bd){ bd = score; best = p; }
  }
  return best;
}

/* Put the selected unit in the middle of the window. */
function centerCameraOn(unit){
  const v = visibleTiles();
  cameraX = unit.x - v / 2 + 0.5;
  cameraY = unit.y - v / 2 + 0.5;
  clampCamera();
}

/* ---------------------------------------------------------------------
   PROTOTYPE FIX. This function is called on line ~883 and was defined
   nowhere in the file, so every tap on the map threw
   "screenToWorld is not defined" and no unit could ever be selected or
   moved. The game does not currently start.

   The inverse of draw()'s transform: draw() does
       ctx.translate(-cameraX*tile, -cameraY*tile)
   and fills each cell at (x*tile, y*tile), so a client point maps back by
   subtracting the canvas origin, dividing by the CSS-pixel tile size and
   adding the camera. `tile` is already in CSS pixels (size/VIEW_TILES*zoom
   where size is canvas.clientWidth), and getBoundingClientRect is in CSS
   pixels too, so no devicePixelRatio term belongs here.

   Added in this prototype copy only — the real fix belongs in the
   modern-frontline repository.
   --------------------------------------------------------------------- */
function screenToWorld(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.floor((clientX - r.left) / tile + cameraX),
    y: Math.floor((clientY - r.top)  / tile + cameraY)
  };
}

canvas.addEventListener("pointerup",e=>{
  if(!pointerStart) return;
  const wasDrag=didDrag;
  const pos=screenToWorld(e.clientX,e.clientY);
  pointerStart=null;
  didDrag=false;
  if(!wasDrag&&inBounds(pos.x,pos.y)) playerAction(pos.x,pos.y);
  canvas.releasePointerCapture?.(e.pointerId);
});

document.getElementById("zoomIn").addEventListener("click",()=>setZoom(zoom+.25));
document.getElementById("zoomOut").addEventListener("click",()=>setZoom(zoom-.25));
document.getElementById("zoomReset").addEventListener("click",()=>setZoom(1));

document.querySelectorAll("[data-faction]").forEach(b=>{
  b.addEventListener("click",()=>setup(b.dataset.faction));
});

endTurnBtn.addEventListener("click",endPlayerTurn);
document.getElementById("reinforce").addEventListener("click",reinforce);

document.getElementById("nextMission").addEventListener("click",()=>{
  if(campaignMission>=3||!playerFaction) return;
  campaignMission++;
  setup(playerFaction,true);
});
document.getElementById("restart").addEventListener("click",()=>{
  campaignMission=1;
  credits=100;
  campaignWins=0;
  campaignRoster=null;
  gameOver.classList.add("hidden");
  factionOverlay.classList.remove("hidden");
  statusEl.textContent="Choose a faction";
  infoEl.textContent="Select a unit.";
  draw();
});

resize();
